name: CI

on:
  push:
    branches: [ "main", "founding/*", "parallel/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
          
      - name: Check Formatting
        run: zig fmt --check .
        
      - name: Build
        run: zig build
        
      - name: Test
        run: zig build test
        
      - name: Smoke Test
        run: ./scripts/smoke.sh
